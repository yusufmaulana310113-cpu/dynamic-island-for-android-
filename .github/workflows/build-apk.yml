name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cari folder proyek
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts | head -1)
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Proyek ada di: $(dirname "$f")"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
